function getDeviceID() {
    const navigator = window.navigator;
    const screen = window.screen;
    let deviceId = navigator.userAgent + "|" + screen.height + "x" + screen.width + "|" + navigator.language;
    let hash = 0;
    for (let i = 0; i < deviceId.length; i++) {
        const char = deviceId.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash; 
    }
    return "dev-" + Math.abs(hash);
}

function showAndCopyDeviceId() {
    const deviceId = getDeviceID();
    try {
        navigator.clipboard.writeText(deviceId).then(() => {
            alert("Device ID Anda:\n\n" + deviceId + "\n\n(ID telah disalin ke clipboard)");
        }, () => prompt("Device ID Anda:", deviceId));
    } catch (err) { prompt("Device ID Anda:", deviceId); }
}

