function getInitials(name) {
    if (!name) return '?';
    const parts = name.trim().toUpperCase().split(' ');
    if (parts.length === 1) return parts[0].charAt(0) || '?';
    const first = parts[0].charAt(0);
    const second = parts[1].charAt(0);
    return (first + second) || '?';
}

