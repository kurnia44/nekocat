function formatSaldoString(inputString) {
    const rawValue = inputString.replace(/[^0-9]/g, '');
    if (rawValue === '') return 'Rp0,00';
    const numericValue = parseInt(rawValue, 10);
    let formattedValue = new Intl.NumberFormat('id-ID').format(numericValue);
    return `Rp${formattedValue},00`;
}

function formatAccountNumber(e) {
    const input = e.target;
    let digits = input.value.replace(/[^0-9]/g, '');
    const startsWith08 = digits.startsWith('08');
    let formattedValue = '';
    if (digits.length > 0) {
        if (startsWith08) formattedValue = (digits.match(/.{1,4}/g) || []).join('-');
        else formattedValue = (digits.match(/.{1,4}/g) || []).join(' ');
    }
    input.value = formattedValue;
}

function formatInputAsNumber(e) {
    let rawValue = e.target.value.replace(/[^0-9]/g, '');
    if (rawValue === '') {
        e.target.value = '';
    } else {
        let numericValue = parseInt(rawValue, 10);
        let formattedValue = new Intl.NumberFormat('id-ID').format(numericValue);
        e.target.value = formattedValue;
    }
}

