if (logoutButton) {
    logoutButton.addEventListener('click', () => {
        if (confirm("Apakah Anda yakin ingin logout? Token Anda akan dihapus.")) {
            localStorage.removeItem('userToken');
            localStorage.removeItem('tokenExpiryDate');
            localStorage.removeItem('tokenRemainingLogins');
            localStorage.removeItem('tokenExpiry'); 
            localStorage.removeItem('isTrialUser'); 
            sessionStorage.removeItem('akses_diterima'); 
            setupOverlay.style.display = 'none';
            receiptOverlay.style.display = 'none';
            pinOverlay.style.display = 'none';
            accountSwitcherOverlay.style.display = 'none';
            loadingOverlay.style.display = 'none';
            tokenInput.value = "";
            tokenInput.disabled = false;
            tokenError.textContent = "Anda telah logout.";
            tokenOverlay.style.display = 'flex';
        }
    });
}
if (viewTokenDataLink && tokenDataPanel && tokenExpiryDisplay && tokenLoginsDisplay) {
    viewTokenDataLink.addEventListener('click', (e) => {
        e.preventDefault();
        const isVisible = tokenDataPanel.style.display === 'block';
        tokenDataPanel.style.display = isVisible ? 'none' : 'block';
        viewTokenDataLink.textContent = isVisible ? 'Lihat data token' : 'Sembunyikan data token';
        if (!isVisible) {
            const expiry = localStorage.getItem('tokenExpiryDate') || 'Tidak diketahui';
            const logins = localStorage.getItem('tokenRemainingLogins');
            tokenExpiryDisplay.textContent = expiry;
            tokenLoginsDisplay.textContent = (logins === null || logins === 'Tidak diketahui') ? 'Tidak diketahui' : (logins.toString().toLowerCase() === 'unlimited' ? 'Unlimited' : `${logins}x`);
        }
    });
}
if (catatanInput && charCounterDisplay) {
    catatanInput.addEventListener('input', () => {
        charCounterDisplay.textContent = `${catatanInput.value.length}/${catatanInput.maxLength}`;
        catatanInput.style.height = 'auto'; catatanInput.style.height = (catatanInput.scrollHeight) + 'px';
    });
    catatanInput.dispatchEvent(new Event('input'));
}
if (nominalInput && minTextElement && continueButton) {
    nominalInput.addEventListener('input', (e) => {
        formatInputAsNumber(e); 
        let numericValue = parseInt(e.target.value.replace(/[^0-9]/g, ''), 10) || 0;
        const formattedMin = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(MIN_TRANSFER_LIMIT).replace('Rp', 'Rp');
        minTextElement.textContent = `Minimum transfer adalah ${formattedMin}`;
        if (numericValue === 0 || numericValue >= MIN_TRANSFER_LIMIT) {
            minTextElement.style.color = originalMinColor;
            continueButton.disabled = numericValue === 0; 
        } else {
            minTextElement.style.color = 'red'; continueButton.disabled = false; 
        }
    });
}
if (transferForm && pinOverlay && pinBackButton) {
    transferForm.addEventListener('submit', (e) => { e.preventDefault(); pinOverlay.style.display = 'flex'; });
    pinBackButton.addEventListener('click', (e) => { e.preventDefault(); pinOverlay.style.display = 'none'; resetPin(); });
}
allNumpadButtons.forEach(button => {
    if (button.classList.contains('backspace')) button.addEventListener('click', handleBackspace);
    else if (!button.classList.contains('blank')) button.addEventListener('click', () => handlePinInput(button.textContent.trim()));
});
if (receiptOverlay && receiptDoneButton) {
    receiptDoneButton.addEventListener('click', (e) => {
        e.preventDefault(); receiptOverlay.style.display = 'none';
        nominalInput.value = ''; continueButton.disabled = true; 
        const formattedMin = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(MIN_TRANSFER_LIMIT).replace('Rp', 'Rp');
        minTextElement.textContent = `Minimum transfer adalah ${formattedMin}`; minTextElement.style.color = originalMinColor;
        catatanInput.value = ''; catatanInput.dispatchEvent(new Event('input')); 
        if (receiptExpandedDetails) receiptExpandedDetails.classList.remove('expanded');
        if (receiptToggleLink) {
            receiptToggleLink.classList.remove('expanded');
            receiptToggleLink.querySelector('span:first-child').textContent = 'Lihat Detail Transaksi';
        }
        window.scrollTo(0, 0); setupOverlay.style.display = 'flex'; loadSetupFormWithSavedData();
    });
}
if (openOrderFormButton) {
