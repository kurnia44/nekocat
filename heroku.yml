if (changeBalanceButton && accountSwitcherOverlay) {
    changeBalanceButton.addEventListener('click', (e) => { e.preventDefault(); updateAccountSwitcherUI(); accountSwitcherOverlay.style.display = 'flex'; });
}
if (accountSwitcherCloseBtn && accountSwitcherOverlay) {
    accountSwitcherCloseBtn.addEventListener('click', (e) => { e.preventDefault(); accountSwitcherOverlay.style.display = 'none'; });
}
if (accountSwitcherContent && accountSwitcherOverlay) {
    accountSwitcherContent.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-select-account')) {
            const newIndex = parseInt(e.target.dataset.index, 10);
            if (newIndex !== activeAccountIndex) { activeAccountIndex = newIndex; saveAccounts(); updateMainPageAccount(); }
            accountSwitcherOverlay.style.display = 'none';
        }
        if (e.target.classList.contains('btn-edit-account')) {
            const indexToEdit = parseInt(e.target.dataset.index, 10);
            const currentAccount = sourceAccounts[indexToEdit];
            const newName = prompt("Edit Nama Akun:", currentAccount.name);
            if (newName === null) { alert("Edit dibatalkan."); return; }
            const newNumber = prompt("Edit Nomor Akun:", currentAccount.number);
            if (newNumber === null) { alert("Edit dibatalkan."); return; }
            const currentCleanBalance = currentAccount.balance.replace('Rp', '').replace(',00', '');
            const newBalanceInput = prompt("Edit Saldo Akun (Cukup input angka):", currentCleanBalance);
            if (newBalanceInput === null) { alert("Edit dibatalkan."); return; }
            const newFormattedBalance = formatSaldoString(newBalanceInput); 
            sourceAccounts[indexToEdit] = { name: newName, number: newNumber, balance: newFormattedBalance };
            saveAccounts(); updateAccountSwitcherUI();
            if (indexToEdit === activeAccountIndex) updateMainPageAccount();
            alert("Data akun berhasil diperbarui!");
        }
    });
}
