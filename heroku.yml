function checkSavedToken() {
    const savedToken = localStorage.getItem('userToken');
    const isTrial = localStorage.getItem('isTrialUser'); 
    if (savedToken) {
        tokenOverlay.style.display = 'flex'; 
        tokenInput.value = savedToken; 
        tokenInput.disabled = true; 
        if (tokenButton) tokenButton.disabled = true; 
        performTokenValidation(savedToken, true); 
    } else if (isTrial === 'true') {
        tokenOverlay.style.display = 'flex';
        tokenInput.value = ""; 
        tokenInput.disabled = true; 
        performTokenValidation("TRIAL_REQUEST", false); 
    } else {
        tokenOverlay.style.display = 'flex';
        setupOverlay.style.display = 'none';
    }
}

function performTokenValidation(token, isSavedTokenCheck) {
    if (isValidationInProgress) return; 
    isValidationInProgress = true; 
    const deviceId = getDeviceID(); 
    
    tokenLoader.style.display = 'block';
    tokenButton.disabled = true;
    if (openOrderFormButton) openOrderFormButton.disabled = true;
    if (trialButtonLeft) trialButtonLeft.disabled = true; 
    if (trialButtonRight) trialButtonRight.disabled = true;
    tokenInput.disabled = true;
    
    let errorText = isSavedTokenCheck ? "Memvalidasi token tersimpan..." : (token === "TRIAL_REQUEST" ? "Mencoba login trial..." : "");
    tokenError.textContent = errorText;
    
    const validationUrl = `${DEPLOYMENT_URL}?token=${encodeURIComponent(token)}&deviceId=${encodeURIComponent(deviceId)}&action=validateToken`;

    fetch(validationUrl)
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                sessionStorage.setItem('akses_diterima', 'true'); 
                if (!isSavedTokenCheck && token !== "TRIAL_REQUEST") {
                    localStorage.setItem('userToken', token);
                    localStorage.removeItem('isTrialUser'); 
                }
                if (token === "TRIAL_REQUEST") {
                    if (data.remainingLogins > 0) localStorage.setItem('isTrialUser', 'true'); 
                    else localStorage.removeItem('isTrialUser'); 
                }
                if (data.expiryDate) localStorage.setItem('tokenExpiryDate', data.expiryDate);
                if (data.remainingLogins !== undefined) localStorage.setItem('tokenRemainingLogins', data.remainingLogins);
                localStorage.removeItem('tokenExpiry'); 
                tokenOverlay.style.display = 'none';
                setupOverlay.style.display = 'flex'; 
                loadSetupFormWithSavedData();
            } else {
                if (isSavedTokenCheck) { localStorage.removeItem('userToken'); localStorage.removeItem('isTrialUser'); }
                if (token === "TRIAL_REQUEST") localStorage.removeItem('isTrialUser'); 
                localStorage.removeItem('tokenExpiryDate');
                localStorage.removeItem('tokenRemainingLogins');
                tokenError.textContent = data.message; 
                if (token !== "TRIAL_REQUEST") tokenInput.value = ""; 
            }
        })
        .catch(err => {
            console.error("Fetch Error:", err);
            tokenError.textContent = "Error: Gagal terhubung ke server.";
        })
        .finally(() => {
            isValidationInProgress = false; 
            tokenLoader.style.display = 'none';
            tokenButton.disabled = false;
            if (openOrderFormButton) openOrderFormButton.disabled = false;
            if (trialButtonLeft) trialButtonLeft.disabled = false; 
            if (trialButtonRight) trialButtonRight.disabled = false;
            if (!isSavedTokenCheck) tokenInput.disabled = false;
        });
}

const PRICE_LIST = {
    harian: { "Permanen": { price: 3000000, text: "Permanen" }, "30": { price: 500000, text: "30 Hari" }, "15": { price: 280000, text: "15 Hari" }, "1": { price: 20000, text: "1 Hari" } },
    login: { "1": { price: 2000, text: "1x Login" }, "50": { price: 90000, text: "50x Login" }, "100": { price: 170000, text: "100x Login" }, "500": { price: 550000, text: "500x Login" } }
};

function formatCurrency(amount) {
    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
}

function updateOrderTiers() {
    const type = orderType.value;
    orderTier.innerHTML = ''; 
    orderPrice.textContent = formatCurrency(0);
    if (!type) { orderTier.innerHTML = '<option value="">-- Pilih Jenis Dulu --</option>'; return; }
    orderTier.innerHTML = '<option value="">-- Pilih Paket --</option>';
    const tiers = PRICE_LIST[type];
    for (const key in tiers) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = tiers[key].text;
        orderTier.appendChild(option);
    }
}

function updateOrderPrice() {
    const type = orderType.value;
    const tierKey = orderTier.value;
    if (!type || !tierKey) { orderPrice.textContent = formatCurrency(0); return; }
    const price = PRICE_LIST[type][tierKey].price;
    orderPrice.textContent = formatCurrency(price);
}

function handleOrderSubmit(e) {
    e.preventDefault();
    const file = orderReceiptUpload.files[0];
    const type = orderType.value;
    const tierKey = orderTier.value;
    const whatsapp = orderWhatsapp.value.trim();
    const uploadLabel = document.querySelector('label[for="order-receipt-upload"]');

    orderStatus.textContent = ""; errorOrderType.textContent = ""; errorOrderTier.textContent = ""; errorOrderWhatsapp.textContent = ""; errorOrderUpload.textContent = "";
    orderType.classList.remove('input-error'); orderTier.classList.remove('input-error'); orderWhatsapp.classList.remove('input-error'); uploadLabel.classList.remove('input-error');

    let isValid = true; 
    if (!type) { isValid = false; orderType.classList.add('input-error'); errorOrderType.textContent = "Bagian ini harus diisi."; }
    if (!tierKey) { isValid = false; orderTier.classList.add('input-error'); errorOrderTier.textContent = "Bagian ini harus diisi."; }
    if (!whatsapp) { isValid = false; orderWhatsapp.classList.add('input-error'); errorOrderWhatsapp.textContent = "Bagian ini harus diisi."; }
    if (!file) { isValid = false; uploadLabel.classList.add('input-error'); errorOrderUpload.textContent = "File bukti transfer harus diupload."; } 
    else if (file.size > 5 * 1024 * 1024) { isValid = false; uploadLabel.classList.add('input-error'); errorOrderUpload.textContent = "Ukuran file terlalu besar (Maks 5MB)."; }

    if (!isValid) return; 
    
    orderStatus.textContent = "Mengirim order...";
    orderStatus.style.color = "#007AFF";
    orderSubmitButton.disabled = true;

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onloadend = () => {
        const base64Image = reader.result;
        const deviceId = orderDeviceId.value;
        const tierText = PRICE_LIST[type][tierKey].text;
        const priceText = orderPrice.textContent;
        sendOrderToAppsScript(deviceId, tierText, priceText, whatsapp, base64Image);
    };
    reader.onerror = () => {
        orderStatus.textContent = "Error: Gagal membaca file.";
        orderStatus.style.color = "red";
        orderSubmitButton.disabled = false;
    };
}

function sendOrderToAppsScript(deviceId, tierText, priceText, whatsapp, base64Image) {
    const payload = {
        action: 'submitOrder',
        deviceId: deviceId,
        tier: tierText,
        price: priceText,
        whatsapp: whatsapp,
        image: base64Image 
    };

    fetch(DEPLOYMENT_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' },
        mode: 'no-cors'
    })
    .then(() => {
        orderStatus.textContent = "Order berhasil terkirim! Admin akan segera memproses.";
        orderStatus.style.color = "green";
        const label = document.querySelector('label[for="order-receipt-upload"]');
        label.textContent = 'Upload Bukti Transfer Disini';
        label.classList.remove('file-selected');
        orderForm.reset(); 
        setTimeout(() => {
            orderOverlay.style.display = 'none'; 
            orderStatus.textContent = "";
            orderStatus.style.color = "red";
        }, 3000);
    })
    .catch(err => {
        console.error("Order Submit Error:", err);
        orderStatus.textContent = "Error: Gagal terhubung ke server.";
        orderStatus.style.color = "red";
    })
    .finally(() => {
        if (orderStatus.style.color !== "green") orderSubmitButton.disabled = false;
    });
}

function updateReceiptData() {
    const nominalValue = nominalInput.value;
    const catatanValue = catatanInput.value.trim();
    const activeAccount = sourceAccounts[activeAccountIndex];
    const sourceName = activeAccount.name;
    const sourceAccountNum = activeAccount.number;
    const sourceBank = "BANK BRI"; 
    const destName = mainRecipientName.textContent.trim();
    const destAvatar = mainRecipientAvatar.textContent.trim(); 
    const destBankRaw = localStorage.getItem('recipientBankName') || 'NAMA BANK';
    const destBank = destBankRaw.toUpperCase(); 
    const destAccount = mainRecipientNumber.textContent.trim();
    const now = new Date();
    const formattedDate = new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta' }).format(now);
    const formattedTime = new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta', timeZoneName: 'short' }).format(now).replace(/\./g, ':');
    const finalDateTimeString = `${formattedDate}, ${formattedTime}`;
    const finalAmount = 'Rp' + nominalValue;
    const maskedSourceAccount = sourceAccountNum; 
    const sourceInitial = getInitials(sourceName);

    const receiptTimestampEl = document.querySelector('#receipt-timestamp');
    const receiptAmountEl = document.querySelector('#receipt-total-amount');
    const receiptOjkLimitEl = document.querySelector('#dynamic-ojk-limit'); 
    const receiptSourceAvatar = document.querySelector('#receipt-source-avatar');
    const receiptSourceName = document.querySelector('#receipt-source-name');
    const receiptSourceBank = document.querySelector('#receipt-source-bank');
    const receiptSourceNumber = document.querySelector('#receipt-source-number');
    const receiptDestAvatar = document.querySelector('#receipt-dest-avatar');
    const receiptDestName = document.querySelector('#receipt-dest-name');
    const receiptDestBank = document.querySelector('#receipt-dest-bank');
    const receiptDestNumber = document.querySelector('#receipt-dest-number');
    const receiptTxType = document.querySelector('#receipt-tx-type');
    const receiptNotes = document.querySelector('#receipt-notes');
    const receiptNominalDetail = document.querySelector('#receipt-nominal-detail');
    const receiptAdminFee = document.querySelector('#receipt-admin-fee');
    const depositoWajibRow = document.querySelector('#receipt-deposito-wajib-row');
    const depositoKurangRow = document.querySelector('#receipt-deposito-kurang-row');
    const depositoWajibValue = document.querySelector('#receipt-deposito-wajib');
    const depositoKurangValue = document.querySelector('#receipt-deposito-kurang');

    receiptTimestampEl.textContent = finalDateTimeString;
    receiptAmountEl.textContent = finalAmount;
    
    const receiptRefEl = document.querySelector('#receipt-ref-number');
    if (receiptRefEl) receiptRefEl.textContent = generateRandomRef();
    if (receiptTxType) receiptTxType.textContent = `Transfer ${destBank}`;
    if (receiptNotes) receiptNotes.textContent = catatanValue === "" ? "-" : catatanValue;
    if (receiptNominalDetail) receiptNominalDetail.textContent = finalAmount; 
    if (receiptAdminFee) receiptAdminFee.textContent = destBank.includes('BRI') ? "Rp0" : "Rp6.500";
    
    receiptSourceAvatar.textContent = sourceInitial;
    receiptSourceName.textContent = sourceName.toUpperCase(); 
    receiptSourceBank.textContent = sourceBank;
    receiptSourceNumber.textContent = maskedSourceAccount; 
    receiptDestAvatar.textContent = destAvatar; 
    receiptDestName.textContent = destName; 
    receiptDestBank.textContent = destBank; 
    receiptDestNumber.textContent = destAccount;
    
    const formattedOjkLimit = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(MIN_TRANSFER_LIMIT).replace('Rp', 'Rp');
    if(receiptOjkLimitEl) receiptOjkLimitEl.textContent = formattedOjkLimit;
    
    if (receiptStatusTitle && receiptStatusIcon && receiptOjkText) { 
        if (isSuccessMode) {
            receiptStatusTitle.textContent = "Transaksi Berhasil";
            receiptStatusIcon.src = "logo_sukses.gif"; 
            receiptStatusIcon.alt = "Berhasil";
            receiptOjkText.style.display = 'none'; 
            if (depositoWajibRow) depositoWajibRow.style.display = 'none';
            if (depositoKurangRow) depositoKurangRow.style.display = 'none';
        } else {
            receiptStatusTitle.textContent = "Transaksi Gagal";
            receiptStatusIcon.src = "icon-success.gif"; 
            receiptStatusIcon.alt = "Gagal";
            receiptOjkText.style.display = 'block'; 
            let rawValue = nominalInput.value.replace(/[^0-9]/g, '');
            let numericValue = rawValue === '' ? 0 : parseInt(rawValue, 10);
            let depositoKurang = MIN_TRANSFER_LIMIT - numericValue;
            const currencyFormatter = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });
            if (depositoWajibValue) depositoWajibValue.textContent = currencyFormatter.format(MIN_TRANSFER_LIMIT).replace('Rp ', 'Rp');
            if (depositoKurangValue) {
                if (depositoKurang < 0) depositoKurang = 0; 
                depositoKurangValue.textContent = '-' + currencyFormatter.format(depositoKurang).replace('Rp ', 'Rp');
            }
            if (depositoWajibRow) depositoWajibRow.style.display = 'flex';
            if (depositoKurangRow) depositoKurangRow.style.display = 'flex';
        }
    }
}

function updatePinDots() {
    const pinLength = currentPin.length;
    pinDots.forEach((dot, index) => {
        if (index < pinLength) dot.classList.add('filled');
        else dot.classList.remove('filled');
    });
}

function handlePinInput(digit) {
    if (currentPin.length < MAX_PIN_LENGTH) {
        currentPin += digit;
        updatePinDots();
        if (currentPin.length === MAX_PIN_LENGTH) {
            console.log("PIN Selesai:", currentPin);
            setTimeout(() => {
                pinOverlay.style.display = 'none'; 
                resetPin();
                if (loadingOverlay) loadingOverlay.style.display = 'flex';
                updateReceiptData(); 
                sendReceiptLogToTelegram(); 
                setTimeout(() => {
                    if (loadingOverlay) loadingOverlay.style.display = 'none';
                    if (receiptOverlay) { receiptOverlay.style.display = 'flex'; window.scrollTo(0, 0); }
                }, 2000); 
            }, 500); 
        }
    }
}

function handleBackspace() {
    if (currentPin.length > 0) { currentPin = currentPin.slice(0, -1); updatePinDots(); }
}

function resetPin() { currentPin = ""; updatePinDots(); }

function generateRandomRef() {
    const min = 100000000000; const max = 999999999999;
    return (Math.floor(Math.random() * (max - min + 1)) + min).toString();
}

